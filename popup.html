<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modus</title>
  <link rel="icon" href="assets/modus-32x32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="settings">
    <header class="header">
      <img src="assets/modus-48x48.png" width="26" height="26" alt="">
      <h1>Modus</h1>
      <span id="ext-version"></span>
    </header>
    <aside class="release-notice" id="release-notice" aria-labelledby="release-heading" hidden>
      <span class="release-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v11m-4-4 4 4 4-4M5 16v4h14v-4"/>
        </svg>
      </span>
      <div class="release-copy">
        <strong id="release-heading">Update available</strong>
        <p id="release-version"></p>
      </div>
      <a id="release-link" target="_blank" rel="noopener noreferrer">View release <span aria-hidden="true">↗</span></a>
    </aside>
    <span id="release-announcement" class="visually-hidden" role="status"></span>
    <div class="settings-columns">
      <section aria-labelledby="activity-title">
        <h2 id="activity-title">Activity</h2>
        <div id="activity-settings"></div>
      </section>
      <section aria-labelledby="workspace-title">
        <h2 id="workspace-title">Workspace</h2>
        <div id="workspace-settings"></div>
      </section>
    </div>
    <aside class="settings-help" id="settings-help" aria-live="polite" aria-label="Setting details" hidden>
      <strong id="help-title"></strong>
      <p id="help-copy"></p>
    </aside>
    <p id="settings-status" role="status" hidden></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
